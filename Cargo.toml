[workspace]
members = ["derive"]

[package]
name = "zod"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Schemas that a literal must satisfy at compile time and input must satisfy at run time."

[dependencies]
serde_json = { version = "1", optional = true }
zod-derive = { version = "0.1.0", path = "derive", optional = true }

[features]
default = ["derive"]
derive = ["dep:zod-derive"]
json = ["dep:serde_json"]
